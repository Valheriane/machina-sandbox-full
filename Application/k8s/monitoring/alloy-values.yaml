crds:
  create: false

alloy:
  configMap:
    create: true
    content: |-
      discovery.kubernetes "machina_pods" {
        role = "pod"

        namespaces {
          names = ["machina-sandbox"]
        }
      }

      discovery.relabel "machina_pod_logs" {
        targets = discovery.kubernetes.machina_pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          action = "replace"
          target_label = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          action = "replace"
          target_label = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          action = "replace"
          target_label = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          action = "replace"
          target_label = "app"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          action = "replace"
          target_label = "job"
          separator = "/"
          replacement = "$1"
        }
      }

      loki.source.kubernetes "machina_pod_logs" {
        targets = discovery.relabel.machina_pod_logs.output
        forward_to = [loki.process.machina_pod_logs.receiver]
      }

      loki.process "machina_pod_logs" {
        stage.static_labels {
          values = {
            cluster = "machina",
          }
        }

        forward_to = [loki.write.local.receiver]
      }

      loki.write "local" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
        }
      }

  clustering:
    enabled: false

  enableReporting: false

  mounts:
    varlog: false
    dockercontainers: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

rbac:
  create: true

  namespaces:
    - machina-sandbox

  rules:
    - apiGroups: [""]
      resources: ["pods", "pods/log"]
      verbs: ["get", "list", "watch"]

  clusterRules: []

serviceAccount:
  create: true
  automountServiceAccountToken: true

controller:
  type: deployment
  replicas: 1

service:
  enabled: true
  type: ClusterIP

serviceMonitor:
  enabled: true
  additionalLabels:
    release: monitoring
