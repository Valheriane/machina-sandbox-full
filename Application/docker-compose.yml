services:
  broker:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker2

    ports:
      - "${MACHINA_MQTT_PORT:-1883}:1883"
      - "${MACHINA_MQTT_WS_PORT:-9001}:9001"

    volumes:
      - type: bind
        source: "${HOST_PROJECT_PATH:-.}/broker/mosquitto.conf"
        target: /mosquitto/config/mosquitto.conf
        read_only: true

      - type: bind
        source: "${HOST_PROJECT_PATH:-.}/broker"
        target: /mosquitto/data

    networks:
      - iotnet

  fleet-api:
    build:
      context: ./fleet-api

    container_name: fleet-api

    environment:
      MQTT_HOST: broker
      MQTT_PORT: 1883
      TOPIC_PREFIX: lab
      SHARED_SECRET: "${MACHINA_SHARED_SECRET:-dev-secret-change-me}"
      DATABASE_URL: sqlite:///data/fleet.db
      CORS_ORIGINS: "${MACHINA_CORS_ORIGINS:-http://localhost:8086,http://127.0.0.1:8086}"

    volumes:
      - type: bind
        source: "${HOST_PROJECT_PATH:-.}/fleet-api/data"
        target: /app/data

    depends_on:
      - broker

    ports:
      - "${MACHINA_API_PORT:-8000}:8000"

    networks:
      - iotnet

  front:
    build:
      context: ./front
      dockerfile: Dockerfile

    ports:
      - "${MACHINA_FRONT_PORT:-8085}:80"

    depends_on:
      - fleet-api
      - broker

    networks:
      - iotnet

networks:
  iotnet:
    driver: bridge