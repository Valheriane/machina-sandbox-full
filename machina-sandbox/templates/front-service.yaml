apiVersion: v1
kind: Service
metadata:
  name: front
spec:
  type: {{ .Values.front.service.type }}

  selector:
    app: front

  ports:
    - name: http
      port: {{ .Values.front.service.port }}
      targetPort: 80
{{- if eq .Values.front.service.type "NodePort" }}
      nodePort: {{ .Values.front.service.nodePort }}
{{- end }}
