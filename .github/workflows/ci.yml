name: CI Machina Sandbox Full

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  # 1) Tests backend (fleet-api)
  backend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Application/fleet-api

    env:
      PYTHONPATH: ${{ github.workspace }}/Application/fleet-api
      SHARED_SECRET: ${{ secrets.SHARED_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Application/fleet-api/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend tests
        run: |
          echo "PWD: $(pwd)"
          echo "PYTHONPATH: $PYTHONPATH"
          pytest

  # 2) Build front (React / Vite)
  front-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Application/front

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Application/front/package-lock.json

      - name: Install front dependencies
        run: npm ci

      - name: Build front
        run: npm run build
  # 3) Validation Helm / Kubernetes / GitOps
  k8s-gitops-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.3

      - name: Install kubeconform
        run: |
          curl -L \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            -o /tmp/kubeconform.tar.gz

          tar -xzf /tmp/kubeconform.tar.gz -C /tmp

          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform

          kubeconform -v

      - name: Validate GitOps manifests
        run: make ci-gitops

